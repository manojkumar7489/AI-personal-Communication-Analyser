<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vocalis AI</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 46px; height: 46px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--primary), var(--secondary)); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; margin-bottom: 14px; box-shadow: 0 0 20px var(--primary-glow);">V</div>
        <h2>Welcome Back</h2>
        <p class="text-sub">Sign in to continue your communication workout</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="you@domain.com" autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px;">Log In</button>
      </form>

      <div style="text-align: center; margin-top: 24px;">
        <p class="text-sub">Don't have an account? <a href="/pages/signup.html" style="color: var(--primary-light); font-weight: 600;">Sign up</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
