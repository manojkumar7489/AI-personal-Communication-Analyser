<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Vocabulary | Vocalis AI</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="content-container">
        <div style="margin-bottom: 24px;">
          <h1 class="text-gradient">Contextual Vocabulary Builder</h1>
          <p class="text-lead">Elevated terminology extracted directly from your past conversation topics.</p>
        </div>

        <div id="vocab-cards-container" class="vocab-grid">
          <p class="text-sub">Analyzing conversations for tailored vocabulary recommendations...</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/vocabulary.js"></script>
</body>
</html>
